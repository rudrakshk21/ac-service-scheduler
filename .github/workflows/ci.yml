name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Once a week, so a newly published advisory against a dependency shows up without waiting for a change.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: No personal data in committed files
        run: npm run check:privacy
      # Only what ships to people's phones: development tools do not reach users.
      - name: Known vulnerabilities in the dependencies that ship
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage
      - name: Python reference tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s reference -p "test_*.py" 2>&1 | tee python-test.log || {
            echo "::error title=Python reference tests failed::$(tail -c 1200 python-test.log | tr '\n' '|')"
            exit 1
          }
      - run: npm run build
      - name: Size budget (first download 300 KB, NFR-3)
        run: npm run check:size
