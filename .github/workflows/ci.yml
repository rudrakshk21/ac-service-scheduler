name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Python reference tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s reference -p "test_*.py" 2>&1 | tee python-test.log || {
            echo "::error title=Python reference tests failed::$(tail -c 1200 python-test.log | tr '\n' '|')"
            exit 1
          }
      - run: npm run build
