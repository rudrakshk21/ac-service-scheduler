version: 2
updates:
  # One pull request a week per ecosystem, with the small updates together, so the tests and the size budget
  # decide whether it can be merged and nobody has to read a dozen separate pull requests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
